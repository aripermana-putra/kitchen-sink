openapi: "3.0.3"
info:
  title: UCP API (DI comparison)
  version: "1.0.0"

paths:
  /compute:
    post:
      operationId: CreateCompute
      summary: Submit a compute instance provisioning request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComputeRequest'
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncResponse'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /compute/{name}:
    get:
      operationId: GetCompute
      summary: Get a compute instance
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInstance'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /database:
    post:
      operationId: CreateDatabase
      summary: Submit a database provisioning request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncResponse'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /database/{name}:
    get:
      operationId: GetDatabase
      summary: Get a database instance
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseInstance'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateComputeRequest:
      type: object
      required: [name, tenantId, provider]
      properties:
        name:
          type: string
        tenantId:
          type: string
        provider:
          type: string
          enum: [gcp, aws]
        size:
          type: string
          enum: [small, medium, large]
          default: medium

    ComputeInstance:
      type: object
      properties:
        name:
          type: string
        tenantId:
          type: string
        provider:
          type: string
        size:
          type: string
        status:
          type: string
        workflowId:
          type: string

    CreateDatabaseRequest:
      type: object
      required: [name, tenantId, engine]
      properties:
        name:
          type: string
        tenantId:
          type: string
        engine:
          type: string
          enum: [postgres, mysql]
        tier:
          type: string
          enum: [small, medium, large]
          default: medium

    DatabaseInstance:
      type: object
      properties:
        name:
          type: string
        tenantId:
          type: string
        engine:
          type: string
        tier:
          type: string
        status:
          type: string
        workflowId:
          type: string

    AsyncResponse:
      type: object
      properties:
        workflowId:
          type: string
        status:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string

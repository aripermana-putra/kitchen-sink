apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-example-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-example-app
  template:
    metadata:
      labels:
        app: prometheus-example-app
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: system-pool
      containers:
        - name: prometheus-example-app
          image: quay.io/brancz/prometheus-example-app:v0.6.0
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-example-app
  namespace: default
spec:
  selector:
    app: prometheus-example-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080

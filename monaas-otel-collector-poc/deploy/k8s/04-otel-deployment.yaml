apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-deployment
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-deployment
rules:
  - apiGroups: [""]
    resources: ["events", "namespaces", "namespaces/status", "nodes", "nodes/spec", "pods", "pods/status", "replicationcontrollers", "replicationcontrollers/status", "resourcequotas", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["daemonsets", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-deployment
subjects:
  - kind: ServiceAccount
    name: otel-deployment
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: otel-deployment
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-deployment
  namespace: monitoring
spec:
  mode: deployment
  image: otel/opentelemetry-collector-contrib:0.159.0
  serviceAccount: otel-deployment
  nodeSelector:
    workload: spot
  tolerations:
    - key: workload
      operator: Equal
      value: spot
      effect: NoSchedule
  config:
    receivers:
      k8s_cluster:
        collection_interval: 30s
      prometheus:
        config:
          scrape_configs:
            - job_name: sample-app
              scrape_interval: 15s
              static_configs:
                - targets: ["prometheus-example-app.default.svc.cluster.local:8080"]
    processors:
      batch: {}
    exporters:
      prometheus_remote_write:
        endpoint: "http://mimir.monitoring.svc.cluster.local:8080/api/v1/push"
    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster, prometheus]
          processors: [batch]
          exporters: [prometheus_remote_write]

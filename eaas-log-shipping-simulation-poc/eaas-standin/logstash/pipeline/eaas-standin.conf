# EaaS Log Shipping Simulation PoC — stand-in Logstash pipeline.
#
# Mirrors EaaS's documented shape (Filebeat -> Logstash gateway -> Kafka -> Elasticsearch/Kibana):
# beats input -> per-log_group filter (GROK/JSON, approximating EaaS's hand-tuned-per-log-group
# onboarding pattern) -> Kafka (durability buffer) + Elasticsearch (searchable index), same as the
# real architecture's dual role for Kafka. See design.md Scope for why Kafka has no SASL/TLS here.

input {
  beats {
    port => 5044
  }
}

filter {
  # log_group is set client-side by Filebeat (fields.geap.log_group), same convention as real
  # EaaS onboarding. Everything below approximates the hand-tuned-per-log-group GROK/JSON pattern
  # EaaS's own onboarding guides describe.

  if [fields][geap][log_group] == "sample-go-service" {
    # ADR-007 slog JSON shape: already valid JSON, just promote fields to top level.
    json {
      source => "message"
      target => "parsed"
    }
    mutate {
      add_field => {
        "level" => "%{[parsed][level]}"
        "request_id" => "%{[parsed][request_id]}"
        "user_id" => "%{[parsed][user_id]}"
        "app_msg" => "%{[parsed][msg]}"
      }
      remove_field => ["parsed"]
    }
  }

  else if [fields][geap][log_group] == "temporal-server" {
    # Temporal Server's own zap logger already emits JSON by default — no GROK needed, same
    # treatment as the sample-go-service shape, but Temporal's own field names (msg, ts, level,
    # error, logging-call-at, stacktrace, wf-id, wf-run-id, service, operation) are kept as-is
    # rather than remapped to ADR-007's convention, since this is third-party log output.
    json {
      source => "message"
      target => "parsed"
    }
    mutate {
      add_field => {
        "level" => "%{[parsed][level]}"
        "app_msg" => "%{[parsed][msg]}"
      }
    }
    # error/service are only present on some Temporal Server log lines — guard each with its own
    # existence check so absent fields don't leak an unresolved "%{[parsed][x]}" token into the
    # indexed doc (found during Phase 5 verification: a naive unconditional add_field does this).
    if [parsed][error] {
      mutate { add_field => { "temporal_error" => "%{[parsed][error]}" } }
    }
    if [parsed][service] {
      mutate { add_field => { "temporal_service" => "%{[parsed][service]}" } }
    }
    mutate { remove_field => ["parsed"] }
  }

  else if [fields][geap][log_group] == "temporal-worker" {
    # Temporal Go SDK's default logger is PLAIN TEXT, not JSON — "YYYY/MM/DD HH:MM:SS LEVEL  msg
    # key val key val ..." with no "=" delimiter on the trailing key/value tokens, so Logstash's
    # kv filter (which expects key=value) does not apply cleanly. GROK extracts the fixed-shape
    # prefix; the variable trailing tokens are kept as one raw field (worker_context) rather than
    # fully split — an explicit, recorded parsing gap, not silently dropped.
    grok {
      match => {
        "message" => "^%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME} %{WORD:level}%{SPACE}%{GREEDYDATA:worker_line}"
      }
      tag_on_failure => ["_workergrokfailure"]
    }
    # Split worker_line into a short human-readable message (first sentence-like chunk before
    # the first recognized key token) and the raw trailing context, on a best-effort basis.
    grok {
      match => {
        "worker_line" => "^(?<app_msg>.*?)(?:\s+(?<worker_context>(Namespace|WorkflowID|TaskQueue)\s.*))?$"
      }
      tag_on_failure => ["_workerlinesplitfailure"]
    }
  }

  else if [fields][geap][log_group] == "crossplane-core" {
    # Crossplane core/providers emit zap JSON by default, but the stream also carries
    # plain-text deprecation warnings on stderr (e.g. "Warning: ... is deprecated") mixed in —
    # the filter must not fail the whole event when a line isn't JSON.
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
    if "_jsonparsefailure" not in [tags] {
      mutate {
        add_field => {
          "level" => "%{[parsed][level]}"
          "app_msg" => "%{[parsed][msg]}"
        }
      }
      if [parsed][logger] {
        mutate { add_field => { "crossplane_logger" => "%{[parsed][logger]}" } }
      }
      mutate { remove_field => ["parsed"] }
    } else {
      # Non-JSON line (e.g. a deprecation warning) — keep as-is, tag so it's still
      # distinguishable in Kibana without pretending it parsed as structured JSON.
      mutate {
        add_field => { "app_msg" => "%{message}" }
        add_tag => ["crossplane_nonjson_line"]
      }
    }
  }

  mutate {
    add_field => {
      "geap_log_group" => "%{[fields][geap][log_group]}"
      "geap_client_id" => "%{[fields][geap][client_id]}"
    }
  }
}

output {
  kafka {
    codec => json
    topic_id => "eaas-standin-durability"
    bootstrap_servers => "kafka:9092"
  }
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "eaas_stg-poc_%{[geap_client_id]}_%{[geap_log_group]}-%{+YYYY.MM.dd}"
  }
}

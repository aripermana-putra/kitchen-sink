apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: metrics-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "01-prometheus-direct"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [metrics-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: app-01
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            replacement: ${1}
            action: replace
            source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(.+)
            replacement: $1:$2

      - job_name: "02-otel-sdk-via-collector"
        static_configs:
          - targets: ["otel-collector:8889"]

      - job_name: "03-hashicorp"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [metrics-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: app-03
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(.+)
            target_label: __address__
            replacement: $1:$2

      - job_name: "04-victoriametrics"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [metrics-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: app-04
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(.+)
            target_label: __address__
            replacement: $1:$2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: metrics-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: metrics-lab
spec:
  selector:
    app: prometheus
  type: NodePort
  ports:
    - port: 9090
      nodePort: 30090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: metrics-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-lab-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-lab-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-lab-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: metrics-lab

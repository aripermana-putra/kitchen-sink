# All 4 app deployments + services in one file for easy apply/delete.
# Images are built locally — load them into Colima before applying:
#   make build-images
#   make load-images

---
# ── 01: prometheus-direct ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-01
  namespace: metrics-lab
spec:
  replicas: 2  # Run 2 replicas to observe multi-pod metric aggregation
  selector:
    matchLabels:
      app: app-01
  template:
    metadata:
      labels:
        app: app-01
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: kitchen-sink/01-prometheus-direct:latest
          imagePullPolicy: Never  # use locally loaded image
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: app-01
  namespace: metrics-lab
spec:
  selector:
    app: app-01
  ports:
    - port: 8081

---
# ── 02: otel-sdk ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-02
  namespace: metrics-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-02
  template:
    metadata:
      labels:
        app: app-02
    spec:
      containers:
        - name: app
          image: kitchen-sink/02-otel-sdk:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.metrics-lab.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "02-otel-sdk"
---
apiVersion: v1
kind: Service
metadata:
  name: app-02
  namespace: metrics-lab
spec:
  selector:
    app: app-02
  ports:
    - port: 8082

---
# ── 03: hashicorp ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-03
  namespace: metrics-lab
spec:
  replicas: 2  # 2 replicas: observe the Summary aggregation problem in Grafana
  selector:
    matchLabels:
      app: app-03
  template:
    metadata:
      labels:
        app: app-03
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: kitchen-sink/03-hashicorp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: app-03
  namespace: metrics-lab
spec:
  selector:
    app: app-03
  ports:
    - port: 8083

---
# ── 04: victoriametrics ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-04
  namespace: metrics-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-04
  template:
    metadata:
      labels:
        app: app-04
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: kitchen-sink/04-victoriametrics:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: app-04
  namespace: metrics-lab
spec:
  selector:
    app: app-04
  ports:
    - port: 8084

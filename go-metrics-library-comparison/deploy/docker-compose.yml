version: "3.9"

services:
  app-01:
    build: ../01-prometheus-direct
    ports:
      - "8081:8081"

  app-02:
    build: ../02-otel-sdk
    ports:
      - "8082:8082"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=02-otel-sdk
    depends_on:
      - otel-collector

  app-03:
    build: ../03-hashicorp
    ports:
      - "8083:8083"

  app-04:
    build: ../04-victoriametrics
    ports:
      - "8084:8084"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (app-02 pushes here)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (Prometheus in K8s scrapes this)

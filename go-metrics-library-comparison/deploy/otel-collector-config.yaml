receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s

exporters:
  # Exposes collected metrics at :8889/metrics for Prometheus to scrape.
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel

  # Debug exporter — logs received metrics to stdout (useful while testing).
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]

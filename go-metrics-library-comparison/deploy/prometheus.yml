global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "01-prometheus-direct"
    static_configs:
      - targets: ["app-01:8081"]

  # 02-otel-sdk does not expose /metrics — Prometheus scrapes the OTel Collector instead.
  - job_name: "02-otel-sdk-via-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "03-hashicorp"
    static_configs:
      - targets: ["app-03:8083"]

  - job_name: "04-victoriametrics"
    static_configs:
      - targets: ["app-04:8084"]
